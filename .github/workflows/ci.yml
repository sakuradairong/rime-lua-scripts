name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua & luarocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3 lua5.1 liblua5.1-dev luarocks
      - name: Install luacheck
        run: sudo luarocks install luacheck
      - name: Lint
        run: luacheck lua tests --no-max-line-length

  test:
    name: Test (Lua 5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3
      - name: Run tests
        run: |
          set -e
          for f in tests/test_*.lua; do
            echo "==> $f"
            lua5.3 "$f"
          done

  test-luajit:
    name: Test (LuaJIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Run tests
        run: |
          set -e
          for f in tests/test_*.lua; do
            echo "==> $f"
            luajit "$f"
          done

  test-lua51:
    name: Test (Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Run tests
        run: |
          set -e
          for f in tests/test_*.lua; do
            echo "==> $f"
            lua5.1 "$f"
          done
